<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            <!-- TAREA PARA EL ALUMNO:
                 Crea un formulario que envíe los datos mediante POST a "/crear-cuenta".
                 Debe contener campos para:
                 - Nombre completo (texto)
                 - Correo electrónico (email)
                 - Contraseña (password)
                 - Pseudónimo (texto con patrón de validación: [letras de 3 a 10]-[números de 2 a 10])
                 - Género (radio buttons: Femenino, Masculino, Otro)
                 - Tipo de Suscripción (select: Gratis, Premium Mensual, Premium Anual)
                 - Fecha de nacimiento (date)
                 - Aceptar términos y condiciones (checkbox)
                 - Comentarios adicionales o gustos (textarea)
            -->
            <form class="auth-form" method="post" action="/crear-cuenta">
                <!-- Escribe tus etiquetas (label) e inputs aquí -->
                <h2>Crear cuenta</h2>
                <div>
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Alejandro Javier" required minlength="3" maxlength="80">
                </div>

                <div>
                    <label for="correo">Correo electronico</label>
                    <input type="email" id="correo" name="correo" placeholder="alex@gmail.com" required maxlength="100">
                </div>

                <div>
                    <label for="contraseña">Contraseña</label>
                    <input type="password" id="contraseña" name="contraseña" placeholder="Mínimo 8 caracteres" required minlength="8" maxlength="16" autocomplete="off">
                </div>

                <div>
                    <label for="pseudonimo">Pseudonimo</label>
                    <input type="text" id="pseudonimo" name="pseudonimo" required pattern="[A-Za-z]{3,10}-[0-9]{2,10}" placeholder="ElTilinMasInsano-777" minlength="6" >
                </div>

                <div>
                    <label>Genero</label>
                    <input type="radio" id="rad_femenino" name="genero" value="femenino" required>
                    <label for="rad_femenino">Femenino</label>
                    <input type="radio" id="rad_masculino" name="genero" value="masculino">
                    <label for="rad_masculino">Masculino</label>
                    <input type="radio" id="rad_otro" name="genero" value="otro">
                    <label for="rad_otro">Otro</label>
                </div>

                <div>
                    <label for="suscripcion">Tipó de Suscripción</label>
                    <select name="suscripcion" id="suscripcion" required>
                        <option value="">--- Selecciona una opción ---</option>
                        <option value="gratis">Gratis (con anuncios)</option>
                        <option value="premium_mensual">Premium Mensual ($99/mes</option>
                        <option value="premium_anual">Premium Anual ($1000/año</option>
                    </select>
                </div>

                <div>
                    <label for="fecha_nacimiento">Fecha de nacimiento</label>
                    <input type="date" name="fecha_nacimiento" id="fecha_nacimiento" required>
                </div>

                <div>
                    <label for="terminos">Acepto los terminos y condiciones de uso</label>
                    <input type="checkbox" id="terminos" value="aceptado" required>
                </div>

                <div>
                    <label for="comentarios">Comentarios</label>
                    <textarea id="comentarios" name="comentarios" rows="4" cols="40" placeholder="Cuentanos que musica te gusta"></textarea>
                </div>
            </form>
            <div>
                <button type="submit">Registrarse</button>
                <button type="reset">Limpiar formulario</button>
            </div>
            </form>
            <p>¿Ya tienes una cuenta? <a href="iniciar-sesion.html">Iniciar Sesión</a></p>

            <p>Pantalla principal <a href="index.html">inicio</a></p>
        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
