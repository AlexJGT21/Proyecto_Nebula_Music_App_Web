<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Iniciar Sesión</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

<main class="auth-container">
    <section class="auth-card">
        <!--Formulario que envia una peticion POST
        Con action se escribe la URL
        -->
        <form action="autentication" method="post" enctype="application/x-www-form-urlencoded">
            <h1>Inicio de sesión</h1>

            <div>
                <label for="correo">
                    Correo electronico
                </label>
                <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required minlength="5" maxlength="100">
            </div>

            <div>
                <label for="contraseña">Contraseña</label>
                <input type="password" id="contraseña" name="contraseña" placeholder="********" required minlength="8">
            </div>

            <div>
                <button type="submit">Iniciar Sesión</button>
                <button type="reset">Limpiar formulario</button>
            </div>
        </form>
        <p>¿Aún no tienes cuenta? <a href="registro.html">regístrate aquí</a></p>

        <p>Pantalla principal <a href="index.html">inicio</a></p>
    </section>
</main>

<footer>
    <p>Copyright Nébula 2025.</p>
</footer>

</body>
</html>
