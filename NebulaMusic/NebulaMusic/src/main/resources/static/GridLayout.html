<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>

    <style>
        .contenedor-basico {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 10px;
            border: 1px solid black;
            padding: 10px;
            background-color: gray;
            margin-bottom: 30px;
        }

        .caja-basica {
            height: 100px;
            background-color: rebeccapurple;
            border: 2px solid blue;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        /* Se aplica solo cuando el ancho de la pantalla mide 768 px o menos */
        @media (max-width: 768px) {
            .contenedor-basico {
                grid-template-columns: 100px 100px;
            }

            body {
                background-color: #EDF67D;
            }
        }

        /* Este se aplica SOLO cuando la pantalla mide 768px o más */
        @media (min-width: 768px) {
            body {
                background-color: blue;
            }
        }
        
        @media (width >= 768px) {
            
        }
        
        @media (425px < width < 768px) {
            
        }

        .parent {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 5px;
            max-width: 500px;
            border: 1px solid black;
            padding: 5px;
            background-color: gray;
        }

        .parent div {
            border: 1px solid black;
            background-color: #EFBDEB;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .div1 {
            /**Fila inicio, columna inicio, fila fin, columna fin */
            grid-area: 1 / 1 / 3 / 2;
        }

        .div2 {
            grid-area: 1 / 2 / 3 / 4;
        }

        .div3 {
            grid-area: 1 / 4 / 2 / 5;
        }

        .div4 {
            grid-area: 2 / 4 / 3 / 5;
        }

        .div5 {
            grid-area: 3 / 1 / 5 / 3;
        }

        .div6 {
            grid-area: 4 / 3 / 5 / 5;
        }

        .div7 {
            grid-area: 3 / 3 / 4 / 5;
        }

    </style>

</head>
<body>
    <div class="parent">
        <div class="div1">1</div>
        <div class="div2">2</div>
        <div class="div3">3</div>
        <div class="div4">4</div>
        <div class="div5">5</div>
        <div class="div6">6</div>
        <div class="div7">7</div>
    </div>

        <div class="caja-basica">4</div>
        <div class="caja-basica">5</div>
        <div class="caja-basica">6</div>
    </div -->
</body>
</html>
